<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:url("https://images.unsplash.com/photo-1503428593586-e225b39bddfe");
  background-size:cover;
  background-position:center;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
}
.card{
  z-index:1;
  width:380px;
  border-radius:15px;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card p-4 shadow">
  <h3 class="text-center mb-4">Admin Login</h3>

  <!-- ERROR MESSAGE -->
  <div id="errorMsg" class="alert alert-danger d-none"></div>

  <input id="username" class="form-control mb-3" placeholder="Username">
  <input id="password" type="password" class="form-control mb-4" placeholder="Password">

  <button class="btn btn-primary w-100" onclick="login()">Login</button>
</div>

<script>
function login(){
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  const errorBox = document.getElementById("errorMsg");

  errorBox.classList.add("d-none");
  errorBox.innerText = "";

  // ❌ Empty validation
  if(!u || !p){
    errorBox.innerText = "Please enter both username and password";
    errorBox.classList.remove("d-none");
    return;
  }

  // ❌ Password length validation
  if(p.length < 6){
    errorBox.innerText = "Password must be at least 6 characters";
    errorBox.classList.remove("d-none");
    return;
  }

  // ✅ Admin check
  if(u === "admin" && p === "admin123"){
    localStorage.setItem("admin","true");
    window.location.href = "admin-dashboard.html";
  }else{
    errorBox.innerText = "Invalid admin credentials";
    errorBox.classList.remove("d-none");
  }
}
</script>

</body>
</html>
