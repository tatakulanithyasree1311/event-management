<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVENT MANAGEMENT</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; }

    .hero {
      height: 100vh;

      url('https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2');
      background-size: cover;
      background-position: center;
      color: #fff;
      display: flex;
      align-items: center;
    }

    .hero h1 { font-size: 3.5rem; font-weight: 700; }

    .btn-outline-light {
      border-radius: 30px;
      padding: 12px 35px;
      margin-top: 25px;

    .navbar a { color: #fff !important; font-weight: 500; }

    .top-bar {
      font-size: .9rem;
      background: rgba(0,0,0,.25);
      color: #fff;
      padding: 6px 0;
    }

    .image-container {
      background-image: linear-gradient(rgba(54, 104, 173, 0.7),rgba(180,58,140,.7));
      display:flex;
      flex-direction: column;
      justify-content: space-around;
      padding:30px;
    }

    .event-container {
      display: flex;
      justify-content:space-evenly;

<nav class="navbar navbar-expand-lg navbar-dark position-absolute w-100">

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">

        <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
      </ul>
