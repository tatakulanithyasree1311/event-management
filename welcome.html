<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Management</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
    }

    .hero {
      height: 100vh;
      background: linear-gradient(
        rgba(180,58,140,.7),
        rgba(58,123,213,.7)
      ),
      url('13.jpg');
      background-size: cover;
      background-position: center;
      color: #fff;
      display: flex;
      align-items: center;
    }

    .hero h1 {
      font-size: 3.2rem;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .view-btn {
      padding: 12px 40px;
      font-size: 1.1rem;
      border-radius: 30px;
      margin-top: 20px;
    }

    .navbar a {
      color: #fff !important;
      font-weight: 500;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark position-absolute w-100">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand fw-bold" href="#">
      Hi, <span class="fw-light" id="userName"></span>
    </a>

    <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="container text-center">
    <h1>Welcome to Event Management</h1>
    <p class="lead">
      It is our distinct honor to welcome you to the <b>Event Management</b> platform.
    </p>

    <a href="events.html" class="btn btn-primary view-btn">
      View Events
    </a>
  </div>
</section>

<!-- SCRIPT -->
<script>
  const user = JSON.parse(localStorage.getItem("loggedUser"));

  /* ❗ IMPORTANT FIX */
  if (!user) {
    window.location.replace("signin.html");
  } else {
    document.getElementById("userName").innerText = user.name;
  }

  function logout() {
    localStorage.removeItem("loggedUser");
    window.location.replace("index.html");
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
