<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* REMOVE DEFAULT MARGIN */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

/* BACKGROUND */
body{
  background-image: url('11.jpg');
  background-size: cover;
  background-position: center;
}

/* DASHBOARD BOX */
.box{
  height:300px;
  border-radius:20px;
  background-size:cover;
  background-position:center;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

/* OVERLAY */
.overlay{
  background:rgba(0,0,0,0.6);
  height:100%;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:26px;
  font-weight:bold;
}

/* LOGOUT BUTTON */
.logout-btn{
  position:fixed;
  top:20px;
  right:20px;
  z-index:10;
}
</style>
</head>

<body>

<!-- 🔐 SESSION VALIDATION -->
<script>
  const admin = localStorage.getItem("admin");
  if(admin !== "true"){
    window.location.replace("admin.html");
  }
</script>

<!-- LOGOUT BUTTON -->
<button class="btn btn-danger logout-btn" onclick="logout()">Logout</button>

<div class="container vh-100 d-flex align-items-center">
  <div class="row w-100 g-4">

    <!-- ADD EVENTS -->
    <div class="col-md-6">
      <div class="box"
        style="background-image:url('https://i.pinimg.com/736x/ae/40/e3/ae40e383d34d6321af048e4111a8025c.jpg')"
        onclick="location.href='add-events.html'">
        <div class="overlay">➕ Add Events</div>
      </div>
    </div>

    <!-- VIEW REGISTRATIONS -->
    <div class="col-md-6">
      <div class="box"
        style="background-image:url('7.jpg')"
        onclick="location.href='registrations.html'">
        <div class="overlay">📋 View Registrations</div>
      </div>
    </div>

  </div>
</div>

<script>
/* 🚪 SAFE LOGOUT (DATA NOT DELETED) */
function logout(){
  localStorage.removeItem("admin"); // ONLY admin session removed
  window.location.replace("index.html");
}
</script>

</body>
</html>
